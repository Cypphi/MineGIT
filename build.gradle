plugins {
	id 'java'
	id 'xyz.wagyourtail.unimined' version("1.4.1")
}

group project.maven_group
version project.mod_version

base {
	archivesName = 'MineGIT-forge'
}

// this is just here so we can test the outputs easier and clean between tests
unimined.useGlobalCache = false

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
}

repositories {
	maven {
		name = "wagyourtail releases"
		url = "https://maven.wagyourtail.xyz/releases"
	}
	maven {
		name = "sponge"
		url = "https://repo.spongepowered.org/maven"
	}
	mavenCentral()
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		searge()
		mcp("stable", project.mcp_version)
	}

	minecraftForge {
		loader project.forge_version
		mixinConfig "minegit.mixins.json"
	}

	defaultRemapJar = true
}

configurations {
	mainImplementation
}

sourceSets {
	main {
		compileClasspath += configurations.mainImplementation
		runtimeClasspath += configurations.mainImplementation
	}
}

dependencies {
	mainImplementation "org.spongepowered:mixin:0.8.5-SNAPSHOT"

	// JGit
	modImplementation "org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}

	filesMatching("mcmod.info") {
		expand "version": project.version
	}
}