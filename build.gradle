plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'ploceus' version "${ploceus_version}"
}

loom {
	runs {
		client {
			programArgs "--userProperties", "{}"
		}
	}
}

ploceus {
	setIntermediaryGeneration(1)
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
    mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings ploceus.featherMappings(project.feather_build)
	nests ploceus.nests(project.nests_build)
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	ploceus.dependOsl(project.osl_version)

	// JGit and its runtime dependencies
	implementation "org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r"
	include "org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r"
	include "com.googlecode.javaewah:JavaEWAH:1.1.13"
	include "org.slf4j:slf4j-api:1.7.30"
	include "org.apache.logging.log4j:log4j-slf4j-impl:2.19.0"

	// Minecraft 12w49a predates libraries expected by Mod Menu and OSL.
	implementation "org.apache.logging.log4j:log4j-api:2.19.0"
	include "org.apache.logging.log4j:log4j-api:2.19.0"
	implementation "org.apache.logging.log4j:log4j-core:2.19.0"
	include "org.apache.logging.log4j:log4j-core:2.19.0"
	implementation "com.google.code.gson:gson:2.10.1"
	include "com.google.code.gson:gson:2.10.1"
	include "com.google.guava:guava:17.0"
	include "org.apache.httpcomponents:httpcore:4.3.2"
	include "org.apache.httpcomponents:httpclient:4.3.3"
	include "commons-codec:commons-codec:1.9"
	include "commons-logging:commons-logging:1.1.3"

	// Mod Menu
	modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
